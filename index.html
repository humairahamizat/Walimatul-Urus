<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walimatulurus Hisyam & Auni</title>
<style>
  html,body{margin:0;height:100%;background:#1c1a17;font-family:Georgia,'Times New Roman',serif}
  #cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#f3e9d2;background:radial-gradient(circle at 50% 30%,#3a3326,#1c1a17 70%);padding:24px;box-sizing:border-box;
    transition:opacity .6s}
  #cover.hide{opacity:0;pointer-events:none}
  #cover small{letter-spacing:4px;font-size:12px;opacity:.8;text-transform:uppercase}
  #cover h1{font-size:clamp(30px,8vw,56px);font-weight:normal;margin:18px 0 8px}
  #cover p{opacity:.8;margin:0 0 36px}
  #openBtn{background:transparent;color:#f3e9d2;border:1px solid #d8c28a;padding:14px 44px;font-size:16px;
    letter-spacing:5px;cursor:pointer;border-radius:40px;font-family:inherit}
  #openBtn:active{background:#d8c28a;color:#1c1a17}
  #site{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
  #ctrl{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:none;gap:8px;align-items:center}
  #ctrl button,#ctrl a{background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:20px;padding:9px 14px;font-size:13px;
    text-decoration:none;cursor:pointer;font-family:system-ui,sans-serif}
</style>
</head>
<body>

<div id="cover">
  <small>Walimatulurus</small>
  <h1>Hisyam &amp; Auni</h1>
  <p>Anda dijemput hadir</p>
  <button id="openBtn">OPEN</button>
</div>

<iframe id="site" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="ctrl">
  <button id="musicBtn">🔊 Muzik</button>
  <a id="direct" href="https://walimatulurushisyamdanauni.canva.link/" target="_blank" rel="noopener">Buka terus ↗</a>
</div>

<!-- Letak fail lagu dalam repo yang sama, nama: lagu.mp3 -->
<audio id="bgm" src="lagu.mp3" loop preload="auto"></audio>

<script>
  var CANVA_URL = "https://walimatulurushisyamdanauni.canva.link/";
  var audio = document.getElementById("bgm");
  var cover = document.getElementById("cover");
  var site = document.getElementById("site");
  var ctrl = document.getElementById("ctrl");
  var musicBtn = document.getElementById("musicBtn");

  document.getElementById("openBtn").addEventListener("click", function () {
    // Mainkan lagu serta-merta (klik = kebenaran browser untuk autoplay)
    audio.play().catch(function () {});
    site.src = CANVA_URL;
    site.style.display = "block";
    ctrl.style.display = "flex";
    cover.classList.add("hide");
    setTimeout(function () { cover.style.display = "none"; }, 600);
  });

  musicBtn.addEventListener("click", function () {
    if (audio.paused) { audio.play(); musicBtn.textContent = "🔊 Muzik"; }
    else { audio.pause(); musicBtn.textContent = "🔇 Muzik"; }
  });
</script>
</body>
</html>
