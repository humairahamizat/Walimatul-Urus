<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walimatul Urus Hisyam & Auni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Italiana&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{--silver:#e4d9d2;--wine:#5a1424}
  html,body{margin:0;height:100%;overflow:hidden;background:#12040a}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--silver);-webkit-tap-highlight-color:transparent}

  /* ===== Latar satin merah marun ===== */
  .satin{position:fixed;inset:0;cursor:pointer;
    background:
      radial-gradient(ellipse 120% 50% at 10% 15%, rgba(145,35,58,.55), transparent 62%),
      radial-gradient(ellipse 100% 45% at 95% 42%, rgba(105,20,42,.65), transparent 65%),
      radial-gradient(ellipse 120% 40% at 30% 88%, rgba(135,30,52,.5), transparent 65%),
      linear-gradient(160deg,#1a060c 0%,#3b0f1b 35%,#1b060d 60%,#4a1322 80%,#12040a 100%)}
  .satin::before{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 18%,rgba(255,205,210,.11) 30%,transparent 42%,transparent 58%,rgba(255,185,195,.09) 70%,transparent 82%);
    background-size:220% 100%;animation:sheen 14s ease-in-out infinite alternate}
  .satin::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.6) 100%)}
  @keyframes sheen{from{background-position:0% 0}to{background-position:100% 0}}

  /* ===== Bingkai halus (macam renda) ===== */
  .frame{position:fixed;inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid rgba(228,217,210,.55);border-radius:22px;pointer-events:none;z-index:2}
  .frame::after{content:"";position:absolute;inset:7px;border:1px dotted rgba(228,217,210,.45);border-radius:16px}

  /* ===== Bunga ===== */
  .fl{position:fixed;height:auto;pointer-events:none;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .tl{top:-8px;left:-8px;width:min(80vw,400px)}
  .br{bottom:-8px;right:-8px;width:min(80vw,400px);transform:rotate(180deg)}
  .tr{top:-4px;right:-4px;width:min(38vw,190px);transform:scaleX(-1)}
  .bl{bottom:-4px;left:-4px;width:min(38vw,190px);transform:scaleY(-1)}

  /* ===== Kandungan ===== */
  .stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;box-sizing:border-box;pointer-events:none}
  .small{font-size:clamp(11px,3vw,14px);letter-spacing:.45em;text-transform:uppercase;opacity:.85;margin:0 0 14px;animation:up 1.2s .2s both}
  h1{margin:0;font-weight:normal;line-height:.95;animation:up 1.2s .4s both}
  .cap{display:block;font-family:'Italiana','Bodoni Moda',Georgia,serif;font-size:clamp(40px,12.5vw,76px);letter-spacing:.02em;color:#fff}
  .script{display:block;font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:clamp(50px,16vw,96px);color:#fff;margin:-.08em 0 0 .9em}
  .names{font-style:italic;font-size:clamp(22px,6.5vw,32px);margin:22px 0 4px;animation:up 1.2s .7s both}
  .orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 10px;opacity:.8;animation:up 1.2s .8s both}
  .orn i{display:block;width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--silver))}
  .orn i:last-child{transform:scaleX(-1)}
  .orn b{width:7px;height:7px;background:var(--silver);transform:rotate(45deg)}
  .inv{font-size:clamp(13px,3.6vw,16px);letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin:0 0 34px;animation:up 1.2s .9s both}

  #goBtn{pointer-events:auto;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(15px,4.2vw,18px);letter-spacing:.18em;text-transform:uppercase;
    color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid var(--silver);
    border-radius:40px;padding:15px 38px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 0 0 4px rgba(228,217,210,.12),0 10px 30px rgba(0,0,0,.45);animation:up 1.2s 1.1s both,glow 3s 2.3s ease-in-out infinite}
  #goBtn:active{transform:scale(.97)}
  .hint{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-top:16px;animation:up 1.2s 1.3s both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes glow{50%{box-shadow:0 0 0 7px rgba(228,217,210,.2),0 10px 30px rgba(0,0,0,.45)}}
</style>
</head>
<body>

<!-- Definisi bunga (tak dipaparkan terus) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gRose" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#b8234d"/><stop offset=".6" stop-color="#7d0f30"/><stop offset="1" stop-color="#42081a"/></radialGradient>
    <radialGradient id="gRose2" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#9c1a40"/><stop offset="1" stop-color="#4f0b20"/></radialGradient>
    <radialGradient id="gOrc" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7d9dc"/></radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f4a2c"/><stop offset="1" stop-color="#16301a"/></linearGradient>

    <path id="leaf" d="M0 0C30-18 80-16 110 0C80 16 30 18 0 0Z" fill="url(#gLeaf)"/>

    <g id="rose">
      <g fill="url(#gRose)" stroke="#4a0818" stroke-width=".6">
        <ellipse cx="0" cy="-16" rx="13" ry="17"/>
        <ellipse cx="0" cy="-16" rx="13" ry="17" transform="rotate(72)"/>
        <ellipse cx="0" cy="-16" rx="13" ry="17" transform="rotate(144)"/>
        <ellipse cx="0" cy="-16" rx="13" ry="17" transform="rotate(216)"/>
        <ellipse cx="0" cy="-16" rx="13" ry="17" transform="rotate(288)"/>
      </g>
      <g fill="url(#gRose2)" stroke="#4a0818" stroke-width=".5">
        <ellipse cx="0" cy="-9" rx="8" ry="10" transform="rotate(36)"/>
        <ellipse cx="0" cy="-9" rx="8" ry="10" transform="rotate(108)"/>
        <ellipse cx="0" cy="-9" rx="8" ry="10" transform="rotate(180)"/>
        <ellipse cx="0" cy="-9" rx="8" ry="10" transform="rotate(252)"/>
        <ellipse cx="0" cy="-9" rx="8" ry="10" transform="rotate(324)"/>
      </g>
      <circle r="5" fill="#4a0818"/>
      <circle r="2.2" fill="#8c1a3a"/>
    </g>

    <g id="orchid">
      <g fill="url(#gOrc)" stroke="#cdbcc0" stroke-width=".6">
        <ellipse cx="0" cy="-15" rx="10" ry="16"/>
        <ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(72)"/>
        <ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(144)"/>
        <ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(216)"/>
        <ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(288)"/>
      </g>
      <ellipse cx="0" cy="3" rx="5" ry="7" fill="#e7a3b8"/>
      <circle r="3" fill="#d8c25a"/>
    </g>

    <g id="plume" fill="#b02a58">
      <circle cx="0" cy="0" r="4.5"/><circle cx="10" cy="-6" r="4"/><circle cx="19" cy="-14" r="3.6"/>
      <circle cx="27" cy="-24" r="3.2"/><circle cx="33" cy="-35" r="2.8"/><circle cx="37" cy="-46" r="2.4"/><circle cx="39" cy="-57" r="2"/>
      <circle cx="4" cy="-9" r="3.4" fill="#d4507f"/><circle cx="14" cy="-18" r="3" fill="#d4507f"/><circle cx="23" cy="-29" r="2.6" fill="#d4507f"/><circle cx="29" cy="-40" r="2.2" fill="#d4507f"/>
    </g>

    <g id="cluster">
      <use href="#leaf" transform="translate(6,40) rotate(35) scale(1.55)"/>
      <use href="#leaf" transform="translate(40,6) rotate(62) scale(1.4)"/>
      <use href="#leaf" transform="translate(4,125) rotate(14) scale(1.25)"/>
      <use href="#leaf" transform="translate(125,4) rotate(78) scale(1.15)"/>
      <use href="#plume" transform="translate(150,30) rotate(70) scale(1.4)"/>
      <use href="#plume" transform="translate(30,160) rotate(-20) scale(1.3)"/>
      <use href="#rose" transform="translate(62,62) scale(1.3)"/>
      <use href="#rose" transform="translate(148,40) scale(.85)"/>
      <use href="#rose" transform="translate(40,152) scale(.9)"/>
      <use href="#orchid" transform="translate(108,108) scale(.95) rotate(12)"/>
      <use href="#orchid" transform="translate(178,88) scale(.62) rotate(-18)"/>
      <use href="#orchid" transform="translate(76,192) scale(.62) rotate(25)"/>
      <circle cx="200" cy="30" r="5" fill="#9b1b41"/><circle cx="30" cy="205" r="5" fill="#9b1b41"/>
    </g>

    <g id="mini">
      <use href="#leaf" transform="translate(4,28) rotate(40) scale(.9)"/>
      <use href="#leaf" transform="translate(28,4) rotate(58) scale(.8)"/>
      <use href="#rose" transform="translate(36,36) scale(.8)"/>
      <use href="#orchid" transform="translate(78,22) scale(.5)"/>
      <use href="#orchid" transform="translate(22,80) scale(.5)"/>
    </g>
  </defs>
</svg>

<div class="satin" id="tap"></div>

<svg class="fl tl" viewBox="0 0 300 300"><use href="#cluster"/></svg>
<svg class="fl br" viewBox="0 0 300 300"><use href="#cluster"/></svg>
<svg class="fl tr" viewBox="0 0 120 120"><use href="#mini"/></svg>
<svg class="fl bl" viewBox="0 0 120 120"><use href="#mini"/></svg>
<div class="frame"></div>

<div class="stage">
  <h1><span class="cap">WALIMATUL</span><span class="script">Urus</span></h1>
  <div class="names">Hisyam &amp; Auni</div>
  <div class="orn"><i></i><b></b><i></i></div>
  <p class="inv">Anda dijemput hadir</p>
  <button id="goBtn">Buka Undangan</button>
</div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
  var CANVA_URL = "https://walimatulurushisyamdanauni.canva.link/";
  var PLAY_MUSIC = true;          // letak false kalau lagu dah dimasukkan dalam Canva
  var HIDDEN_DELAY_SAAT = 900;    // lagu pause selepas tetamu tinggalkan page ni sekian saat

  var audio = document.getElementById("bgm");
  var goBtn = document.getElementById("goBtn");
  var tapped = false;

  function bukaKad() {
    if (PLAY_MUSIC) { audio.play().catch(function(){}); tapped = true; }
    var w = window.open(CANVA_URL, "_blank");
    if (!w) { window.location.href = CANVA_URL; return; }
    goBtn.textContent = "Buka Semula Kad";
  }
  document.getElementById("tap").addEventListener("click", bukaKad);
  goBtn.addEventListener("click", bukaKad);

  if (PLAY_MUSIC) {
    var hideTimer = null, pausedByTimer = false;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { if (!audio.paused) { pausedByTimer = true; audio.pause(); } }, HIDDEN_DELAY_SAAT * 1000);
      } else {
        clearTimeout(hideTimer);
        if (pausedByTimer) audio.play().catch(function(){});
        pausedByTimer = false;
      }
    });
    function keepPlaying() { if (tapped && !document.hidden && audio.paused) audio.play().catch(function(){}); }
    audio.addEventListener("pause", function () { setTimeout(keepPlaying, 150); });
    audio.addEventListener("stalled", keepPlaying);
    setInterval(keepPlaying, 1000);
  }
</script>
</body>
</html>
