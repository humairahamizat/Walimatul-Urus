<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walimatulurus Hisyam & Auni</title>
<style>
  html,body{margin:0;height:100%;background:#1c1a17;overflow:hidden}

  /* Cover = gambar sampul surat (cover.jpg) */
  #cover{position:fixed;inset:0;background:#2a0f14 url("cover.jpg") center/cover no-repeat;
    cursor:pointer;-webkit-tap-highlight-color:transparent}

  #goBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(7% + env(safe-area-inset-bottom,0px));
    background:rgba(0,0,0,.45);color:#fff;border:1px solid #fff;border-radius:40px;padding:13px 34px;font-size:15px;
    letter-spacing:1px;cursor:pointer;font-family:Georgia,serif;backdrop-filter:blur(3px);white-space:nowrap}
</style>
</head>
<body>

<div id="cover">
  <button id="goBtn">Teruskan ke halaman</button>
</div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
  var CANVA_URL = "https://walimatulurushisyamdanauni.canva.link/";
  var HIDDEN_DELAY_SAAT = 900;   // lagu pause selepas tetamu tinggalkan page ni sekian saat (900 = 15 minit)

  var audio = document.getElementById("bgm");
  var cover = document.getElementById("cover");
  var goBtn = document.getElementById("goBtn");
  var tapped = false;

  cover.addEventListener("click", function () {
    // Lagu mula serta-merta masa tekan
    audio.play().catch(function(){});
    tapped = true;

    // Buka kad Canva di tab baru (lagu kekal main di tab ini)
    var w = window.open(CANVA_URL, "_blank");
    if (!w) {
      // Kalau browser block tab baru, buka di tab sama sebagai pilihan terakhir
      window.location.href = CANVA_URL;
      return;
    }
    goBtn.textContent = "Buka kad jemputan ↗";   // kalau tetamu kembali ke page ni, boleh tekan lagi
  });

  // Lagu terus main bila tetamu di tab Canva, dan dipause selepas HIDDEN_DELAY_SAAT
  var hideTimer = null, pausedByTimer = false;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (!audio.paused) { pausedByTimer = true; audio.pause(); }
      }, HIDDEN_DELAY_SAAT * 1000);
    } else {
      clearTimeout(hideTimer);
      if (pausedByTimer) { audio.play().catch(function(){}); }
      pausedByTimer = false;
    }
  });

  // Penjaga lagu: kalau lagu terhenti sendiri semasa page ni kelihatan, hidupkan semula
  function keepPlaying() {
    if (tapped && !document.hidden && audio.paused) { audio.play().catch(function(){}); }
  }
  audio.addEventListener("pause", function () { setTimeout(keepPlaying, 150); });
  audio.addEventListener("stalled", keepPlaying);
  setInterval(keepPlaying, 1000);
</script>
</body>
</html>
